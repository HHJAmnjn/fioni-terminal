<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菲欧尼之心 · 私有量化巡航终端</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></script>
    <style>
        body { background-color: #0b0e14; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-bg { background-color: #131722; border: 1px solid #2a2e39; }
        .accent-green { color: #00e676; }
        .accent-red { color: #ff1744; }
        .glow-border { box-shadow: 0 0 15px rgba(0, 230, 118, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航与时钟 -->
    <header class="card-bg border-b border-gray-800 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
            <h1 class="text-xl font-bold tracking-wider text-white">菲欧尼之心 <span class="text-xs px-2 py-0.5 bg-gray-800 text-green-400 rounded border border-gray-700">PRO TERMINAL</span></h1>
        </div>
        
        <!-- 战略时钟 -->
        <div class="flex items-center space-x-6 text-sm">
            <div class="card-bg px-4 py-1.5 rounded-lg border border-gray-800">
                <span class="text-gray-400">北京时间:</span> <span id="bj-time" class="text-white font-mono font-semibold">--:--:--</span>
            </div>
            <div class="card-bg px-4 py-1.5 rounded-lg border border-gray-800">
                <span class="text-gray-400">美东时间:</span> <span id="et-time" class="text-white font-mono font-semibold">--:--:--</span>
            </div>
            <div id="session-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-900 text-green-300 border border-green-700">
                【☀️ 盘中定速巡航】
            </div>
        </div>
    </header>

    <!-- 主体布局 -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- 左侧：标的看板与多空决战台 (4 Cols) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- 置顶 3X 多空核心 -->
            <div class="card-bg rounded-xl p-5 glow-border">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-yellow-400 uppercase tracking-wide">👑 置顶 3X 多空核心矩阵</h2>
                    <span class="text-xs text-gray-500">实时驱动</span>
                </div>
                <div class="space-y-3" id="pinned-container">
                    <!-- 动态注入 -->
                </div>
            </div>

            <!-- 板块点位看板 -->
            <div class="card-bg rounded-xl p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wide">⚡ 核心梯队与技术性成交密集区</h2>
                    <span class="text-xs text-green-400 bg-green-900 bg-opacity-40 px-2 py-0.5 rounded">合规矩阵</span>
                </div>
                <div class="space-y-3 max-h-[500px] overflow-y-auto pr-1" id="sector-container">
                    <!-- 动态注入 -->
                </div>
            </div>
        </div>

        <!-- 右侧：SOXL 专用专业 K 线图表舱 (7 Cols) -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            
            <div class="card-bg rounded-xl p-5 flex-1 flex flex-col min-h-[600px]">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-2">
                        <span class="text-lg font-bold text-white">📈 SOXL 专业 K 线实时终端</span>
                        <span class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded">AMEX:SOXL</span>
                    </div>
                    <span class="text-xs text-gray-400">已接入 TradingView 实时订单流交互组件</span>
                </div>

                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container flex-1 w-full h-full min-h-[520px]">
                    <div class="tradingview-widget-container__widget w-full h-full"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                    {
                      "width": "100%",
                      "height": "100%",
                      "symbol": "AMEX:SOXL",
                      "interval": "D",
                      "timezone": "Etc/UTC",
                      "theme": "dark",
                      "style": "1",
                      "locale": "zh_CN",
                      "enable_publishing": false,
                      "hide_side_toolbar": false,
                      "allow_symbol_change": false,
                      "calendar": false,
                      "support_host": "https://www.tradingview.com"
                    }
                    </script>
                </div>
                <!-- TradingView Widget END -->
            </div>

            <!-- 快捷操作面板 -->
            <div class="card-bg rounded-xl p-4 flex justify-between items-center text-xs text-gray-400">
                <div>当前引擎状态: <span class="text-green-400 font-semibold">🟢 云端量化矩阵正常同步</span></div>
                <div class="space-x-3">
                    <button onclick="alert('已生成 30 字符零折行卡片，可直接粘贴至 Discord！')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-white rounded border border-gray-700 transition">📋 复制 Discord 信号包</button>
                    <button onclick="alert('Webhook 推送已触达云端终点！')" class="px-3 py-1.5 bg-green-700 hover:bg-green-600 text-white rounded transition">🚀 手动触发云端巡检</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 模拟核心行情数据与合规术语渲染
        const mockData = {
            pinned: [
                { sym: "SOXL", spot: 103.74, dense: 98.20, sup: 100.30, res: 105.50, sig: "安全持股" },
                { sym: "SOXS", spot: 8.42, dense: 8.15, sup: 8.20, res: 8.85, sig: "⚡4H超卖" },
                { sym: "TQQQ", spot: 112.50, dense: 108.40, sup: 109.80, res: 114.20, sig: "安全持股" },
                { sym: "SQQQ", spot: 14.20, dense: 13.85, sup: 13.90, res: 14.65, sig: "观望运行" }
            ],
            sectors: [
                { name: "👑 3X多空杠杆决战台", items: [
                    { ticker: "SOXL", spot: "$103.74", dense: "$98.20", sup: "$100.30", res: "$105.50", tag: "安全持股" },
                    { ticker: "SOXS", spot: "$8.42", dense: "$8.15", sup: "$8.20", res: "$8.85", tag: "⚡4H超卖" }
                ]},
                { name: "⚡ 核心高弹性与重点池", items: [
                    { ticker: "SPY", spot: "$582.30", dense: "$578.10", sup: "$575.50", res: "$586.20", tag: "安全持股" },
                    { ticker: "COHR", spot: "$96.40", dense: "$94.20", sup: "$93.50", res: "$99.10", tag: "🔥双周期见底" },
                    { ticker: "PLTR", spot: "$44.80", dense: "$43.10", sup: "$42.50", res: "$46.80", tag: "⚠️日线超买" }
                ]}
            ]
        };

        function renderUI() {
            // 渲染置顶卡片
            const pinnedEl = document.getElementById('pinned-container');
            pinnedEl.innerHTML = mockData.pinned.map(item => `
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-white text-sm">${item.sym}</span>
                        <span class="text-gray-400 ml-2">现: $${item.spot}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-green-400 font-mono">密集区: $${item.dense}</span>
                        <span class="ml-2 px-1.5 py-0.5 bg-gray-800 text-gray-300 rounded">${item.sig}</span>
                    </div>
                </div>
            `).join('');

            // 渲染板块看板
            const sectorEl = document.getElementById('sector-container');
            sectorEl.innerHTML = mockData.sectors.map(sec => `
                <div class="border border-gray-800 rounded-lg p-3 bg-gray-900 bg-opacity-50 mb-3">
                    <div class="text-xs font-bold text-blue-400 mb-2">${sec.name}</div>
                    <div class="space-y-2">
                        ${sec.items.map(i => `
                            <div class="bg-gray-900 p-2.5 rounded border border-gray-800 text-xs flex flex-col space-y-1">
                                <div class="flex justify-between">
                                    <span class="font-bold text-white">${i.ticker}</span>
                                    <span class="text-white">现: ${i.spot}</span>
                                    <span class="text-gray-400">[${i.tag}]</span>
                                </div>
                                <div class="text-green-400 font-mono">技术性成交密集区: ${i.dense}</div>
                                <div class="text-gray-500">1H撑: ${i.sup} | 1H压: ${i.res}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 时钟更新
        function updateClocks() {
            const now = new Date();
            document.getElementById('bj-time').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
            
            const etOptions = { timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('et-time').innerText = new Intl.DateTimeFormat('en-US', etOptions).format(now) + " ET";
        }

        renderUI();
        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>
</html>
