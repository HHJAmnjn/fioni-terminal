name: Auto Sync Fioni Real Market Data

on:
  schedule:
    # 美股交易日每 30 分钟自动运行一次更新数据
    - cron: '*/30 13-22 * * 1-5'
  workflow_dispatch: # 支持手动点击按钮一键立即刷新

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许自动写入 fioni_data.json 到仓库
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run Market Data Sync
        run: |
          python sync_fioni_data.py

      - name: Commit and Push fioni_data.json
        run: |
          git config --global user.name "fioni-quant-bot"
          git config --global user.email "bot@fioni.local"
          git add fioni_data.json
          git diff --staged --quiet || (git commit -m "chore: sync fioni_data.json [skip ci]" && git push)
